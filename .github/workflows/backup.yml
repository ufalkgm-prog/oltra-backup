name: Backup to oltra-backup

on:
  push:
    branches: [main]

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to oltra-backup via SSH
        env:
          BACKUP_SSH_KEY: ${{ secrets.BACKUP_SSH_KEY }}
        run: |
          # Strip any stray whitespace from the base64 string, then decode into ssh-add
          eval $(ssh-agent -s)
          echo "$BACKUP_SSH_KEY" | tr -d '[:space:]' | base64 -d | ssh-add -
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git push git@github.com:ufalkgm-prog/oltra-backup.git HEAD:main --force
